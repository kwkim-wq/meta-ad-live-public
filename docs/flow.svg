<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 276" role="img" aria-labelledby="flow-title flow-desc"
     xmlns="http://www.w3.org/2000/svg">
  <title id="flow-title">메타 광고 자동화 도구의 전체 진행 흐름</title>
  <desc id="flow-desc">사람과 Claude가 나눠 맡는 11단계 흐름. 앱·토큰 발급과 계정 설정을 처음 한 번 끝내면, 이후에는 소재 전달부터 업로드·캠페인·광고세트·소재·광고 생성과 미리보기까지 Claude가 처리하고, 사람이 3중 확인을 마친 뒤 마지막 단계에서 광고 세 계층이 모두 활성화되며 과금이 시작된다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1400" height="276" fill="#f5f5f5"/>
  <rect x="140" y="36" width="1260" height="80" fill="rgba(45,49,66,0.018)"/>

  <!-- lane dividers -->
  <line x1="0" y1="36" x2="1400" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <line x1="0" y1="116" x2="1400" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <line x1="0" y1="196" x2="1400" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <line x1="140" y1="36" x2="140" y2="196" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

  <!-- phase bands (above header) -->
  <text x="198" y="8" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">처음 한 번</text>
  <line x1="256" y1="5" x2="580" y2="5" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
  <text x="646" y="8" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">매번</text>
  <line x1="676" y1="5" x2="1240" y2="5" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
  <text x="1318" y="8" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em" text-anchor="middle">과금 시작</text>

  <!-- ── step header chips ── -->
  <!-- 0 -->
  <rect x="190" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="198" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">1</text>
  <text x="198" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">SETUP</text>
  <!-- 1 -->
  <rect x="302" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="310" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">2</text>
  <text x="310" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">DISCOVER</text>
  <!-- 2 -->
  <rect x="414" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="422" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">3</text>
  <text x="422" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">CONFIG</text>
  <!-- 3 -->
  <rect x="526" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="534" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">4</text>
  <text x="534" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">ASSETS</text>
  <!-- 4 -->
  <rect x="638" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="646" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">5</text>
  <text x="646" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">UPLOAD</text>
  <!-- 5 -->
  <rect x="750" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="758" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">6</text>
  <text x="758" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">CAMPAIGN</text>
  <!-- 6 -->
  <rect x="862" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="870" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">7</text>
  <text x="870" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">AD SET</text>
  <!-- 7 -->
  <rect x="974" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="982" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">8</text>
  <text x="982" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">CREATIVE</text>
  <!-- 8 -->
  <rect x="1086" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="1094" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">9</text>
  <text x="1094" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">AD</text>
  <!-- 9 -->
  <rect x="1196" y="12" width="20" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
  <text x="1206" y="23" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">10</text>
  <text x="1206" y="34" fill="#4f5d75" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">PREVIEW</text>
  <!-- 10 focal -->
  <rect x="1308" y="12" width="20" height="16" rx="8" fill="rgba(235,108,54,0.20)"/>
  <text x="1318" y="23" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">11</text>
  <text x="1318" y="34" fill="#eb6c36" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">LIVE</text>

  <!-- ── lane labels ── -->
  <text x="70" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace"
