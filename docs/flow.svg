  <text x="1318" y="70" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">3중 확인</text>
  <text x="1318" y="84" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">대상·결과·최종</text>
  <text x="1318" y="96" fill="#7a8399" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">사람 판단</text>

  <!-- ── nodes : CLAUDE lane ── -->
  <!-- 2 계정 조회 -->
