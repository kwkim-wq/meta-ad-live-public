  <rect x="488" y="48" width="20" height="10" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="498" y="56" fill="#7a8399" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">YOU</text>
  <text x="534" y="70" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">소재 전달</text>
  <text x="534" y="84" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">제품_소구점.mp4</text>
  <text x="534" y="96" fill="#7a8399" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">폴더 경로</text>

  <!-- 11 3중 확인 -->
  <rect x="1268" y="44" width="100" height="64" rx="6" fill="#f5f5f5"/>
