  <rect x="260" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="264" y="128" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="274" y="136" fill="#2d3142" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">CLD</text>
  <text x="310" y="150" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">계정 조회</text>
  <text x="310" y="164" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">계정·페이지·픽셀</text>
  <text x="310" y="176" fill="#7a8399" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">Graph API</text>

