  <rect x="152" y="48" width="20" height="10" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="162" y="56" fill="#7a8399" font-size="6" font-family="'Geist Mono',monospace" text-anchor="middle" font-weight="600">YOU</text>
  <text x="198" y="70" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">앱 · 토큰 발급</text>
  <text x="198" y="84" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">약 5분 · 1회</text>
