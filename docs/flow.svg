  <text x="70" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace"
        text-anchor="middle" letter-spacing="0.08em">CLAUDE</text>

  <!-- ── connectors (drawn before nodes) ── -->
  <!-- 1 YOU → 2 CLD : down -->
  <path d="M 248,76 H 302 Q 310,76 310,84 V 124" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 2 → 3 : same lane -->
  <line x1="360" y1="156" x2="372" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 3 CLD → 4 YOU : up -->
  <path d="M 472,156 H 526 Q 534,156 534,148 V 108" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 4 YOU → 5 CLD : down -->
  <path d="M 584,76 H 638 Q 646,76 646,84 V 124" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 5 → 6 → 7 → 8 → 9 → 10 : same lane -->
  <line x1="696" y1="156" x2="708" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="808" y1="156" x2="820" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="920" y1="156" x2="932" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1032" y1="156" x2="1044" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1144" y1="156" x2="1156" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 10 CLD → 11 YOU : up -->
  <path d="M 1256,156 H 1310 Q 1318,156 1318,148 V 108" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 11 YOU → 11 CLD : 승인 후 라이브 (focal-in, 같은 x축이므로 직선) -->
  <path d="M 1318,108 V 118" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- ── nodes : 사람 lane ── -->
  <!-- 1 앱·토큰 -->
