  <text x="982" y="164" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">본문·제목·CTA</text>
  <text x="982" y="176" fill="#7a8399" font-size="6.5" font-family="'Geist Mono',monospace" text-anchor="middle">Graph API</text>

